name: Deploy to Hostinger via FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & FTP Deploy (no Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js 22.19.0
        uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json

      - name: Install deps
        run: npm ci --ignore-scripts

      - name: Patch + Build
        run: |
          node scripts/postinstall.js
          npm run build
          cd dashboard && npm ci --ignore-scripts && npm run build
          cd ..
          ls -lh dist/main.js dashboard/dist/index.html

      - name: Prepare deploy files (fix gitignored deploy/ not in checkout)
        run: |
          # deploy/ is gitignored, so create needed files at repo root
          if [ ! -f ecosystem.config.js ]; then
            if [ -f deploy/ecosystem.config.js ]; then cp deploy/ecosystem.config.js ./ecosystem.config.js; else echo "module.exports={apps:[{name:'openwa',script:'./dist/main.js',instances:1,exec_mode:'fork',env:{NODE_ENV:'production',PORT:10000}}]}" > ecosystem.config.js; fi
          fi
          ls -lh ecosystem.config.js .env.production 2>&1 | head -n 20
          echo "--- deploy files ready ---"

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST || secrets.HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME || secrets.USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || secrets.PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT || secrets.PORT }}
        run: |
          set -e
          HOST=$FTP_HOST
          USER=$FTP_USERNAME
          PASS=$FTP_PASSWORD
          PORT=${FTP_PORT:-21}
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$PASS" ]; then
            echo "::error::Set FTP_HOST, FTP_USERNAME, and FTP_PASSWORD GitHub secrets from hPanel → Files → FTP Accounts → View"
            exit 1
          fi
          echo "FTP $USER@$HOST:$PORT (Hostinger FTP host must be srv*.main-hosting.eu; username is the hPanel FTP account, not root or an IP)"
          # Hostinger shared: FTP host is like srv123.main-hosting.eu (hPanel → FTP Accounts → Host), Port 21, User uXXXXXXXX
          # For hostingersite.com Cloud, Node app root is domains/lightsalmon-hummingbird-788680.hostingersite.com (relative to FTP root, NO leading /)
          # FTP is chrooted to /home/uXXXX, so use relative path "domains/..." not "/domains/..."
          # Use proper quoting for password with special chars, passive mode for Hostinger firewall
          lftp -c "
            set ftp:ssl-allow yes
            set ftp:ssl-force no
            set ssl:verify-certificate no
            set ftp:passive-mode on
            set net:timeout 30
            set net:max-retries 2
            set net:reconnect-interval-base 2
            open -u \"$USER\",\"$PASS\" -p $PORT $HOST
            mkdir -p domains/lightsalmon-hummingbird-788680.hostingersite.com/dist
            mkdir -p domains/lightsalmon-hummingbird-788680.hostingersite.com/dashboard/dist
            mirror --reverse --verbose --overwrite --parallel=2 --continue \
              --exclude node_modules/ --exclude .git/ --exclude data/ \
              ./dist domains/lightsalmon-hummingbird-788680.hostingersite.com/dist
            mirror --reverse --verbose --overwrite --parallel=2 --continue \
              ./dashboard/dist domains/lightsalmon-hummingbird-788680.hostingersite.com/dashboard/dist
            put -O domains/lightsalmon-hummingbird-788680.hostingersite.com package.json
            put -O domains/lightsalmon-hummingbird-788680.hostingersite.com package-lock.json
            put -O domains/lightsalmon-hummingbird-788680.hostingersite.com .npmrc
            put -O domains/lightsalmon-hummingbird-788680.hostingersite.com .nvmrc
            put -O domains/lightsalmon-hummingbird-788680.hostingersite.com ecosystem.config.js
            bye
          " || {
            echo "::error::FTP mirror failed - check FTP_HOST (use srv*.main-hosting.eu, not IP), FTP_USERNAME, FTP_PASSWORD, FTP_PORT=21"
            echo "Find correct values: hPanel → Websites → Dashboard → Files → FTP Accounts → View"
            exit 1
          }
          echo "Upload done - now trigger Hostinger Node restart (if using hPanel Node.js, it auto-restarts on file change) or add SSH PM2 step for VPS"

      - name: Post-deploy info
        run: echo "Deployed to Hostinger FTP. If Node.js app is enabled in hPanel, it will restart automatically. Check https://lightsalmon-hummingbird-788680.hostingersite.com/api/health"
