name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy (no Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js 22.19.0
        uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json

      - name: Install deps (ignore scripts - better-sqlite3 prebuilds)
        run: npm ci --ignore-scripts

      - name: Postinstall patches + Build
        run: |
          node scripts/postinstall.js
          npm run build
          cd dashboard && npm ci --ignore-scripts && npm run build
          cd ..

      - name: Prepare deploy bundle
        run: |
          # Hostinger expects dist + dashboard/dist + package files
          # Copy needed deploy helpers to root if missing
          cp -f deploy/ecosystem.config.js ./ecosystem.config.js 2>/dev/null || echo '{"apps":[{"name":"openwa","script":"./dist/main.js"}]}' > ecosystem.config.js
          cp -f deploy/.env.production ./.env.production 2>/dev/null || true
          cp -f hostinger-env.txt ./hostinger-env.txt 2>/dev/null || true
          # Create tar - only files that exist (no hard fail)
          tar -czf deploy.tar.gz \
            dist \
            dashboard/dist \
            package.json \
            package-lock.json \
            .npmrc \
            .nvmrc \
            ecosystem.config.js \
            2>&1 | head -n 20
          ls -lh deploy.tar.gz
          tar -tzf deploy.tar.gz | head -n 20

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy via SCP (password, no Docker)
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          PORT: ${{ secrets.PORT }}
        run: |
          set -e
          PORT=${PORT:-22}
          echo "Deploying to $USERNAME@$HOST:$PORT"
          # Test connection (timeout 10s)
          timeout 10 sshpass -p "$PASSWORD" ssh -p "$PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o UserKnownHostsFile=/dev/null "$USERNAME@$HOST" "echo connected && pwd" || {
            echo "::error::SSH connect failed to $HOST:$PORT as $USERNAME - check HOST/PORT/USERNAME/PASSWORD secrets"
            echo "For Hostinger Shared Hosting use Host=srv*.main-hosting.eu and PORT=65002 (not 22, not IP). For VPS use IP and PORT=22."
            echo "Try hPanel → Advanced → SSH Access → SSH Details for correct Host/Port"
            exit 1
          }
          sshpass -p "$PASSWORD" scp -P "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null deploy.tar.gz "$USERNAME@$HOST:~/deploy.tar.gz"
          sshpass -p "$PASSWORD" scp -P "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null hostinger-env.txt "$USERNAME@$HOST:~/hostinger-env.txt" 2>/dev/null || echo "no hostinger-env.txt"

      - name: Remote extract & restart PM2
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          PORT: ${{ secrets.PORT }}
        run: |
          PORT=${PORT:-22}
          sshpass -p "$PASSWORD" ssh -p "$PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$USERNAME@$HOST" bash -s <<'EOS'
            set -e
            echo ">> Extract"
            mkdir -p ~/openwa
            tar -xzf ~/deploy.tar.gz -C ~/openwa --strip-components=0
            cd ~/openwa
            if [ -f ~/hostinger-env.txt ] && [ ! -f .env ]; then cp ~/hostinger-env.txt .env; fi
            echo ">> .env PORT=$(grep PORT .env 2>/dev/null || echo 'no .env')"
            echo ">> Install prod deps"
            npm ci --omit=dev --ignore-scripts
            node scripts/postinstall.js || true
            mkdir -p data/sessions data/media data/logs
            if command -v pm2 >/dev/null 2>&1; then
              pm2 describe openwa >/dev/null 2>&1 && pm2 reload openwa --update-env || pm2 start ecosystem.config.js
              pm2 save
            else
              npm i -g pm2
              pm2 start ecosystem.config.js
              pm2 save
            fi
            sleep 3
            pm2 logs openwa --lines 30 --nostream || true
            echo ">> Health"
            curl -f http://127.0.0.1:10000/api/health || curl -f http://127.0.0.1:2785/api/health || echo "health check failed - check PORT in .env vs Hostinger assigned PORT"
          EOS
